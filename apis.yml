name: Alsym Energy
description: >-
  Alsym Energy is a Malden, Massachusetts battery technology company founded in 2015
  by Mukesh Chatter, Rahul Mukherjee, and Kripa Varanasi to develop low-cost,
  high-performance rechargeable batteries that are free of lithium and cobalt. Its
  Na-Series is a line of non-flammable, non-toxic sodium-ion batteries aimed at grid and
  utility-scale energy storage, data-center backup, and industrial applications where
  safety and supply-chain resilience matter. The company uses a proprietary
  AI/computational-materials platform to accelerate battery chemistry development, and has
  raised roughly $111M+ including a $78M round in 2024 led by Tata Limited and General
  Catalyst. Alsym is a hardware/energy-infrastructure manufacturer and does not currently
  publish a public developer API; this profile captures its identity and public web
  surface for the API Evangelist network.
